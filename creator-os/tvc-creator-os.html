}
.wiz { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }

<script>
(() => {
const SERVER = "Cruva";
const BRIDGE = "Claude Code Remote";
const TRIGGER_ID = "trig_01KELia3YQ5dRjxgUqtfMJoH";
const BOT_CLIENT_ID = "1565126862714175620";
const HOME_GUILD = "1532483829300858920"; /* Pharmlitalia Creator Community: the only server this page drives */
const BOT_PERMS = "247952";
const INSTALL_URL = `https://discord.com/oauth2/authorize?client_id=${BOT_CLIENT_ID}&scope=bot%20applications.commands&permissions=${BOT_PERMS}`;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ymd = (d) => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(typeof d === "string" ? d + "T00:00:00Z" : d); x.setUTCDate(x.getUTCDate() + n); return x; };
const todayUTC = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = (s) => { if (!s) return ""; const [, m, d] = s.slice(0, 10).split("-").map(Number); return MON[m - 1] + " " + d; };
const fmtTime = (s) => { try { return new Date(s).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch { return s; } };
const daysBetween = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 864e5);
const dateList = (a, b) => { const out = []; for (let d = a; d <= b; d = ymd(addDays(d, 1))) out.push(d); return out; };
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

const AUTOS = [
  { key: "general_chat", n: "01", name: "General chat manager", what: "Replies to messages in the channel in the community lead’s voice. Risky topics go to mods.", hint: ["general-chat", "general"],
    defaults: { mode: "flag", replyTo: "all", dailyCap: 300, escalate: "refunds, missing commission, payment, complaints, legal, medical claims", quietStart: "", quietEnd: "" } },
  { key: "viral_hooks", n: "02", name: "Viral hooks & angles", skill: "discord-tvc-viral-hooks-and-angles", what: "The #1, #2 and #3 most-viewed relevant market videos from last Sun–Sat, one a day: why the hook worked and how to remake it for the Keto Bundle.", hint: ["viral-hooks", "viral"],
    defaults: { mode: "manual", days: ["Mon", "Tue", "Wed"], time: "14:00", lookback: 7, count: 1, everyone: true } },
  { key: "winning_content", n: "03", name: "Winning angle of the week", skill: "tvc-discord-community-weekly-angle-of-the-week", what: "Last week’s top 3 videos by GMV, one per day: numbers card, script card with translations, how to replicate it for max ad spend.", hint: ["winning-angles", "winning"],
    defaults: { mode: "manual", days: ["Mon", "Tue", "Wed"], time: "12:00", count: 3, tagCreator: true, everyone: true, parts: ["Video post", "Numbers card", "Script card", "How to replicate"] } },
  { key: "wins", n: "04", name: "Creator wins", skill: "discord-tvc-creator-wins", what: "A milestone card and hype message the first time a creator reaches their lifetime 1st, 3rd, 10th, 30th or 50th sale. Tags only the creator.", hint: ["share-wins", "wins"],
    defaults: { mode: "manual", thresholds: "1, 3, 10, 30, 50", checkEvery: 1440, time: "16:00", tagCreator: true, graphic: true, handleFallback: true } },
  { key: "leaderboard", n: "05", name: "Weekly leaderboard", skill: "discord-tvc-weekly-leaderboard", what: "Monday podium card: top 5 creators by GMV for last Sun–Sat, posted with @here.", hint: ["leaderboard"],
    defaults: { mode: "manual", days: ["Mon"], time: "17:00", topN: 5, metric: "GMV", tagCreators: true, everyone: true } },
  { key: "onboarding", n: "06", name: "Creator onboarding", what: "DMs each new member your questions, links their TikTok handle and saves the answers.", hint: ["welcome", "introductions"],
    defaults: { mode: "flag", linkFirst: true, reminderHours: 24, maxReminders: 1, fallback: "private-channel" } }
];
const MODE_LABEL = { auto: "Auto", flag: "Auto with flagging", manual: "Manual approval" };

const state = {
  mcp: null, db: null, sample: null, booted: false, bridge: false,
  ws: null, guild: null, guilds: [], shops: [], shop: null,
  range: "7", from: null, to: null, tab: "overview",
  vSort: "gmv", vPage: 1, vHandle: "", openVideo: null, comm: "overview", lbSort: "score",
  cfg: null, autos: null, ob: null, scoring: null, allow: null, drafts: [], editing: null, commData: null,
  wizStep: 1
};
const unsubs = {};

function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3000); }
function setStatus(id, ok, text) { const el = $(id); el.className = "status" + (ok ? " ok" : ""); el.innerHTML = `<i></i>${esc(text)}`; }
function sym() { return state.shop && state.shop.region === "uk" ? "£" : "$"; }
function money(v, compact) {
  if (v == null || isNaN(v)) return "—";
  if (compact && Math.abs(v) >= 1000) return sym() + (v / 1000).toFixed(Math.abs(v) >= 10000 ? 0 : 1) + "k";
  return sym() + v.toLocaleString(undefined, { minimumFractionDigits: v < 100 && v % 1 ? 2 : 0, maximumFractionDigits: v < 100 ? 2 : 0 });
}
const int = (v) => (v == null || isNaN(v) ? "—" : Math.round(v).toLocaleString());
const pct = (v) => (v == null || isNaN(v) ? "—" : Math.round(v) + "%");
function textOf(res) {
  const p = res && res.payload;
  if (typeof p === "string") return p;
  if (p && typeof p.result === "string") return p.result;
  const t = res && res.content && res.content.find((c) => c.type === "text");
  if (!t) return "";
  try { const j = JSON.parse(t.text); return typeof j.result === "string" ? j.result : t.text; } catch { return t.text; }
}
const numOf = (s) => parseFloat(String(s).replace(/[$£,]/g, ""));
function errMsg(e) {
  const c = e && e.code;
  if (c === "needs_reauth") return "Cruva needs reconnecting: claude.ai Settings → Connectors → Cruva. Then press Refresh.";
  if (c === "server_not_connected" || c === "selection_required") return "Cruva isn’t connected for you. Add it in claude.ai Settings → Connectors.";
  if (c === "not_in_manifest" || c === "not_granted" || c === "consent_required") return "This page isn’t allowed to read Cruva for you. Allow Cruva when the page asks, then press Refresh.";
  if (c === "server_unavailable" || c === "rate_limited") return "Cruva didn’t answer in time. Press Refresh in a moment.";
  if (c === "tool_error") return "Cruva returned an error: " + esc(e.message || "unknown") + ".";
  return "Couldn’t load this (" + esc(c || "error") + "). Press Refresh to try again.";
}
function info(t) { return `<span class="info" title="${esc(t)}" aria-label="${esc(t)}">i</span>`; }
function skel(n) { return Array.from({ length: n || 4 }, () => '<div class="skel"></div>').join(""); }
function chgPill(dir, p) {
  if (p == null || isNaN(p)) return '<span class="chg flat">—</span>';
  if (Math.abs(p) < 0.05) return '<span class="chg flat">no change</span>';
  return `<span class="chg ${dir === "up" ? "up" : "down"}">${dir === "up" ? "▲" : "▼"} ${Math.abs(p).toFixed(Math.abs(p) >= 100 ? 0 : 1)}%</span>`;
}
function cmp(now, prev) { if (prev == null || prev === 0) return now > 0 ? chgPill("up", 100) : chgPill(null, null); const p = (now - prev) / prev * 100; return chgPill(p >= 0 ? "up" : "down", p); }
function rangeLabel() { return fmtDate(state.from) + " – " + fmtDate(state.to) + ", " + state.to.slice(0, 4); }
function watch(key, tool, input, onData, onErr) {
  if (unsubs[key]) { unsubs[key](); delete unsubs[key]; }
  if (!state.mcp) return onErr({ code: "capability_disabled" });
  unsubs[key] = state.mcp.watchTool(SERVER, tool, input, (ev) => ev.type === "data" ? onData(textOf(ev.result)) : onErr(ev.error), { cache: { staleTime: 120000, gcTime: 3600000 } });
}
async function call(tool, input) { const r = await state.mcp.callTool(SERVER, tool, input, { cache: { staleTime: 120000, gcTime: 3600000 } }); return textOf(r); }

/* ---------- parsers ---------- */
function parseStats(text, keys) {
  const out = []; let cur = null;
  for (const line of text.split("\n")) {
    const d = line.match(/^\s+(\d{4}-\d{2}-\d{2}):\s+(-?[\d,\.]+)/);
    if (d && cur) { cur.series.push({ date: d[1], v: numOf(d[2]) }); continue; }
    const m = line.match(/^([A-Za-z][^:]{1,40}):\s+(-?[\d,\.]+)\s*(?:\((up|down)\s+([\d\.]+)%\))?/);
    if (m) { cur = { label: m[1].trim(), v: numOf(m[2]), dir: m[3] || null, pct: m[4] ? parseFloat(m[4]) : null, series: [] }; out.push(cur); }
  }
  const by = {}; keys.forEach((k, i) => { if (out[i]) by[k] = out[i]; }); return by;
}
function parseVideos(text) { const a = text.indexOf("\n["), b = text.lastIndexOf("]"); if (a < 0 || b < a) return []; try { return JSON.parse(text.slice(a + 1, b + 1)); } catch { return []; } }
function hdr(text, re) { const m = text.match(re); return m ? parseInt(m[1], 10) : null; }
function fields(parts) { const f = {}; parts.forEach((p) => { const i = p.indexOf(": "); if (i > 0) f[p.slice(0, i).trim()] = p.slice(i + 2).trim(); }); return f; }
function parseDiscord(text) {
  return text.split("\n").filter((l) => l.startsWith("- @")).map((l) => {
    const parts = l.slice(2).split(" | ");
    const h = parts[0].match(/^@(\S+)\s*\(([^,]*)(?:,\s*discord_user_id:\s*(\d+))?/) || [];
    const f = fields(parts.slice(1)); const tk = f["TikTok"] || "not linked"; const th = tk.match(/@([\w.]+)/);
    return { user: h[1] || "", display: h[2] || "", id: h[3] || "", tiktok: th ? th[1] : "", linked: !/not linked/i.test(tk), roles: f["Roles"] || "0", joined: (f["Joined server"] || "").slice(0, 10) };
  });
}

/* ---------- live link to the Claude session that runs the bot ---------- */
async function ask(type, payload) {
  const req = { type, ...payload, guild: gid(), at: new Date().toISOString() };
  let ref = null;
  if (state.db) { try { ref = await state.db.collection("requests").add({ ...req, status: "sent" }); } catch {} }
  if (!state.mcp || !state.bridge) { toast("Saved. The live link isn’t on, so ask Claude to process queued requests."); return false; }
  try {
    await state.mcp.callTool(BRIDGE, "fire_trigger", { trigger_id: TRIGGER_ID, text: `New ${type} request${ref ? " " + ref.id : ""} from the TVC Creator OS page.` }, { cache: false });
    return true;
  } catch (e) {
    if (ref) { try { await ref.update({ status: "queued", error: e && e.code || "error" }); } catch {} }
    toast(e && (e.code === "server_not_connected" || e.code === "not_in_manifest") ? "Live link isn’t allowed for this page. Request saved for Claude." : "Couldn’t reach Claude right now. Request saved.");
    return false;
  }
}

/* ---------- date range ---------- */
function setRange(r) {
  state.range = r;
  if (r !== "c") { const end = addDays(todayUTC(), -1); state.to = ymd(end); state.from = ymd(addDays(end, -(parseInt(r, 10) - 1))); $("#from").value = state.from; $("#to").value = state.to; }
  $("#custom").hidden = r !== "c";
  $$("#ranges button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.d === r)));
}
$$("#ranges button").forEach((b) => b.addEventListener("click", () => { setRange(b.dataset.d); state.vPage = 1; state.commData = null; render(); }));
["#from", "#to"].forEach((s) => $(s).addEventListener("change", () => { const f = $("#from").value, t = $("#to").value; if (f && t && f <= t) { state.from = f; state.to = t; state.vPage = 1; state.commData = null; render(); } }));
$("#brand").addEventListener("change", (e) => { state.shop = state.shops.find((s) => s.id === e.target.value) || null; try { localStorage.setItem("tvc.shop", state.shop ? state.shop.id : ""); } catch {} state.vPage = 1; state.openVideo = null; state.commData = null; render(); });
$("#refresh").addEventListener("click", async () => { if (state.mcp) { try { await state.mcp.invalidate(SERVER); } catch {} } state.commData = null; await loadWorkspace(); render(); });

/* ---------- routing ---------- */
const TABS = { overview: "Overview", content: "Content", community: "Community", automations: "Automations", approvals: "Approvals", onboarding: "Onboarding", setup: "Bot & channels", welcome: "Setup guide" };
function route() {
  const h = location.hash.replace("#", ""); state.tab = TABS[h] ? h : "overview";
  $$("#nav a").forEach((a) => a.getAttribute("href") === "#" + state.tab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  render();
}
window.addEventListener("hashchange", route);

/* ---------- workspace: Discord server + Cruva brand ---------- */
const gid = () => state.ws && state.ws.guildId;
const chans = () => (state.guild && state.guild.channels) || [];
const chName = (id) => { const c = chans().find((x) => x.id === id); return c ? c.name : ""; };
const canPost = (id) => { const c = chans().find((x) => x.id === id); return !c || c.canPost !== false; };
const ACCESS_HELP = "In Discord, open the channel’s settings → Permissions → Add members or roles → your bot, then allow View Channel, Send Messages, Embed Links and Read Message History. Then press Re-sync From Discord in Bot & channels.";
function guess(hints) { for (const h of hints) { const c = chans().find((x) => x.name === h) || chans().find((x) => x.name.includes(h)); if (c) return c.id; } return ""; }
async function getDoc(path) { if (!state.db) return null; try { const s = await state.db.doc(path).get(); return s.exists ? s.data() : null; } catch { return null; } }
async function putDoc(path, data) {
  if (!state.db) { toast("Saving isn’t available in this view"); return false; }
  try { await state.db.doc(path).set(data); return true; } catch (e) { toast(e && e.code === "quota_exceeded" ? "Storage is full. Delete old drafts, then try again." : "Couldn’t save. Try again."); return false; }
}
async function loadGuilds() { if (!state.db) return; try { const s = await state.db.collection("discord").limit(50).get(); state.guilds = s.docs.map((d) => d.data()).filter((g) => g.guildId === HOME_GUILD); } catch {} }
async function loadWorkspace() {
  state.ws = (await getDoc("workspace/main")) || { guildId: "", shopId: "", done: false };
  await loadGuilds();
  state.guild = state.guilds.find((g) => g.guildId === gid()) || null;
  if (state.ws.shopId && !state.shop) state.shop = state.shops.find((s) => s.id === state.ws.shopId) || null;
  if (!gid()) { state.cfg = { botName: "hayfa - community lead", tone: "", modChannel: "", approverRole: "" }; state.autos = defaultAutos(); state.ob = defaultOb(); state.scoring = defaultScoring(); state.allow = null; updateBadges(); return; }
  const g = gid();
  const [cfg, autos, ob, sc, al] = await Promise.all([getDoc("config/" + g), getDoc("automations/" + g), getDoc("onboarding/" + g), getDoc("scoring/" + g), getDoc("allowlist/" + g)]);
  state.cfg = { botName: state.guild ? state.guild.botName : "hayfa - community lead", tone: "lowercase, short and hype (YAYYY, lessgoooo), one emoji at the end, no trailing x.", modChannel: guess(["moderator-only", "moderator"]), approverRole: "", ...(cfg || {}) };
  state.autos = autos && autos.items ? mergeAutos(defaultAutos(), autos.items) : defaultAutos();
  state.ob = { ...defaultOb(), ...(ob || {}) };
  state.scoring = { ...defaultScoring(), ...(sc || {}) };
  state.allow = al || null;
  subscribeDrafts(); updateBadges();
}
function defaultAutos() { const o = {}; AUTOS.forEach((a) => { o[a.key] = { enabled: true, channel: guess(a.hint), reminderHours: 4, expireHours: 24, ...JSON.parse(JSON.stringify(a.defaults)) }; }); return o; }
function defaultOb() { return { questions: ["What’s your TikTok handle?", "What kind of content do you mostly make?", "Have you sold on TikTok Shop before? Roughly how much?", "What would help you most here: samples, content ideas or commission boosts?"], welcome: "Hey {name}, welcome to the {brand} creator community. Quick hello so we can help you sell more." }; }
function defaultScoring() { return { cap: 50, cooldown: 30, excludedChannels: [], excludedRoles: [], w: { m: 1, rr: 1, pr: 1.5, ad: 2, rg: 0.5, v: 0.5 } }; }
function mergeAutos(base, saved) { const o = {}; Object.keys(base).forEach((k) => (o[k] = { ...base[k], ...(saved[k] || {}) })); return o; }
function botStatus() { setStatus("#stBot", !!state.guild, state.guild ? "Discord: " + state.guild.guildName : "Discord: not set up"); }
function updateBadges() { botStatus(); $("#nAuto").textContent = state.autos ? AUTOS.filter((a) => state.autos[a.key].enabled).length : 0; }
function subscribeDrafts() {
  if (unsubs.__drafts) { unsubs.__drafts(); delete unsubs.__drafts; }
  if (!state.db || !gid()) return;
  try {
    unsubs.__drafts = state.db.collection("drafts").where("guild", "==", gid()).limit(200).onSnapshot((snap) => {
      state.drafts = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((d) => d.guild === HOME_GUILD).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
      $("#nDraft").textContent = state.drafts.filter((d) => d.status === "pending").length;
      if (state.tab === "approvals") renderApprovals($("#view"));
    }, () => {});
  } catch {}
  if (unsubs.__reqs) { unsubs.__reqs(); delete unsubs.__reqs; }
  try { unsubs.__reqs = state.db.collection("requests").where("type", "==", "draft").limit(100).onSnapshot((snap) => { state.building = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((r) => r.guild === HOME_GUILD && (r.status === "sent" || r.status === "queued" || r.status === "working")); if (state.tab === "approvals") renderApprovals($("#view")); }, () => {}); } catch {}
  if (unsubs.__allow) { unsubs.__allow(); delete unsubs.__allow; }
  try { unsubs.__allow = state.db.doc("allowlist/" + gid()).onSnapshot((s) => { state.allow = s.exists ? s.data() : null; if (state.tab === "setup") renderSetup($("#view")); }, () => {}); } catch {}
}
async function saveAutos() { const ok = await putDoc("automations/" + gid(), { guild: gid(), items: state.autos, updatedAt: new Date().toISOString() }); if (ok) { updateBadges(); await syncAllow(); } return ok; }
async function syncAllow() {
  const ids = new Set();
  AUTOS.forEach((a) => { const s = state.autos[a.key]; if (s.enabled && s.channel && s.channel !== "dm") ids.add(s.channel); });
  if (state.cfg.modChannel) ids.add(state.cfg.modChannel);
  const list = [...ids].map((id) => ({ id, name: chName(id) })).sort((a, b) => a.name.localeCompare(b.name));
  const prev = state.allow; const same = prev && JSON.stringify((prev.channels || []).map((c) => c.id).sort()) === JSON.stringify(list.map((c) => c.id).sort());
  const doc = { guild: gid(), channels: list, updatedAt: same ? prev.updatedAt : new Date().toISOString(), syncedAt: same ? prev.syncedAt || null : null };
  if (await putDoc("allowlist/" + gid(), doc)) { state.allow = doc; if (!same) ask("allowlist", {}); }
}

/* ---------- render ---------- */
function render() {
  Object.keys(unsubs).filter((k) => !k.startsWith("__")).forEach((k) => { unsubs[k](); delete unsubs[k]; });

function lineChart(box, series, axisFmt, tipFmt) {
  const a = series[0].pts; if (!a.length) { box.innerHTML = '<div class="empty">No daily data for this range.</div>'; return; }
  const W = 1000, H = 280, L = 58, R = 16, T = 14, B = 30;
  const max = Math.max(1, ...series.flatMap((s) => s.pts.map((p) => p.v)));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = [1, 2, 2.5, 5, 10].map((m) => m * step).find((s) => max / s <= 5) || step * 10; const top = Math.ceil(max / nice) * nice;
  const x = (i) => L + (a.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (a.length - 1)); const y = (v) => T + (H - T - B) * (1 - v / top);
  const path = (pts) => pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const ticks = []; for (let t = 0; t <= top + 1e-9; t += nice) ticks.push(t);
  const every = Math.max(1, Math.ceil(a.length / 8));
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(series.map((s) => s.name).join(" and "))} by day" style="display:block;overflow:visible">
    ${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${axisFmt(t)}</text>`).join("")}
    ${a.map((p, i) => (i % every === 0 || i === a.length - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${fmtDate(p.date)}</text>` : "").join("")}
    ${series.map((s) => (s.area ? `<path d="${path(s.pts)} L${x(s.pts.length - 1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="${s.color}" fill-opacity="0.10"/>` : "") + `<path d="${path(s.pts)}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}
    ${series.map((s) => s.pts.length ? `<circle cx="${x(s.pts.length - 1)}" cy="${y(s.pts[s.pts.length - 1].v)}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>` : "").join("")}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
  </svg><div class="tip" hidden></div>`;
  const svg = box.querySelector("svg"), tip = box.querySelector(".tip"), xh = box.querySelector(".xh");
  svg.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(a.length - 1, Math.round((px - L) / ((W - L - R) / Math.max(1, a.length - 1)))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    tip.hidden = false; tip.style.left = (x(i) / W * r.width) + "px"; tip.style.top = (y(Math.max(...series.map((s) => s.pts[i] ? s.pts[i].v : 0))) / H * r.height) + "px";
    tip.innerHTML = `<b>${fmtDate(a[i].date)}</b>` + series.map((s) => s.pts[i] ? `<br>${esc(s.name)}: ${tipFmt(s.pts[i].v)}` : "").join("");
  });
  svg.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
}

/* ---------- test posts: Claude runs the automation's own skill, so the draft is exactly the finalized format ---------- */
const BUILDABLE = ["viral_hooks", "winning_content", "wins", "leaderboard"];
async function makeTestDraft(key, btn, replaces) {
  if (!BUILDABLE.includes(key)) { toast("Test posts for this automation aren’t set up yet"); return; }
  const old = btn.textContent; btn.disabled = true; btn.textContent = "Asking Claude…";
  try {
    const sent = await ask("draft", { automation: key, test: true, ...(replaces ? { replaces } : {}) });
    if (sent) toast("Claude is building it with the real skill. It appears in Approvals when ready.");
  } finally { btn.disabled = false; btn.textContent = old; }
}

/* Discord markdown, as the post will look */
function md(t) {
  return String(t || "").split("\n").map((line) => {
    let h = esc(line).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/&lt;@!?(\d+)&gt;/g, '<span class="ment">@member</span>').replace(/`(@here|@everyone)`/g, '<span class="ment">$1</span>').replace(/(^|\s)(@here|@everyone)(?=\s|$)/g, '$1<span class="ment">$2</span>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    if (/^# /.test(line)) return `<span class="h1">${h.slice(2)}</span>`;
    if (/^-# /.test(line)) return `<span class="sub">${h.slice(3)}</span>`;
    return h + "\n";
  }).join("");
}
const draftMsgs = (d) => (Array.isArray(d.messages) && d.messages.length ? d.messages : [{ text: d.text || "" }]);

function draftCard(d) {

  if (!posting && d.channel && !canPost(d.channel)) d = { ...d, error: `The bot can’t see #${d.channelName || chName(d.channel)}. ${ACCESS_HELP}` };

    ${d.test ? `<span class="muted">Test draft: Approve &amp; Post sends it to the moderator channel with @here and mentions muted, never to #${esc(d.channelName || chName(d.channel))}.</span>` : d.source === "schedule" ? `<span class="pill line" style="align-self:flex-start">From the schedule · also waiting in #moderator-only</span><span class="muted">Approve here or in the mod chat, whichever comes first. Approving here posts it to #${esc(d.channelName || chName(d.channel))} once, with the 🔥 🤍 🚀 📈 reactions.</span>` : ""}

    ${posting ? '<span class="pill">Posting… Claude is sending it to Discord</span>' : `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm primary" data-act="post" data-id="${esc(d.id)}" ${d.channel ? "" : "disabled"}>Approve &amp; Post</button><button class="btn sm" data-act="edit" data-id="${esc(d.id)}">Edit</button>${d.source === "schedule" ? "" : `<button class="btn sm" data-act="regen" data-id="${esc(d.id)}">Regenerate</button>`}<button class="btn sm ghost" data-act="reject" data-id="${esc(d.id)}">Reject</button></div>`}${d.error ? `<span class="pill bad">${esc(d.error)}</span>` : ""}</article>`;

async function decide(id, act, btn) {
  const d = state.drafts.find((x) => x.id === id); if (!d || !state.db) return; const now = new Date().toISOString(); const ref = state.db.doc("drafts/" + id);
  if (act === "edit") {
    const tas = $$(`textarea[data-edfor="${CSS.escape(id)}"]`);
    if (tas.length && tas[0].hidden) { tas.forEach((t) => (t.hidden = false)); tas[0].focus(); btn.textContent = "Save Edit"; return; }
    const msgs = draftMsgs(d).map((m, i) => ({ ...m, text: (tas[i] ? tas[i].value : m.text).slice(0, 2000) }));
    await ref.update({ messages: msgs, text: msgs.map((m) => m.text).join("\n\n").slice(0, 4000), history: [...(d.history || []), { at: now, what: "Edited" }] }); toast("Edit saved"); return;
  }
  if (act === "regen") { await ref.update({ status: "replaced", decidedAt: now, history: [...(d.history || []), { at: now, what: "Regenerated" }] }); makeTestDraft(d.automation, { textContent: "", disabled: false }, id); return; }
  if (act === "reject") { await ref.update({ status: "rejected", decidedAt: now, history: [...(d.history || []), { at: now, what: "Rejected in Creator OS" }] }); if (d.source === "schedule") ask("reject", { draftId: id }); toast("Rejected"); return; }
  if (act === "post") {
    await ref.update({ status: "posting", decidedAt: now, history: [...(d.history || []), { at: now, what: "Approved, sending to Discord" }] });
    const sent = await ask("post", { draftId: id, channel: d.channel });
    if (!sent) await ref.update({ status: "pending", error: "Couldn’t reach Claude to post. Try again, or ask Claude to post queued drafts." });
  }
}

      const out = await state.sample.json(`Suggest 5 short, friendly onboarding questions a Discord bot asks a new TikTok Shop affiliate creator joining the "${(state.shop || {}).name || "brand"}" creator community. The first must ask for their TikTok handle. Learn their niche, experience, selling history and what help they want. Reply with only a JSON array of 5 strings.`, { modelTier: "quick", cache: false });
      const list = Array.isArray(out) ? out.map(String).slice(0, 6) : [];
      $("#sugg").innerHTML = list.length ? `<div class="callout" style="margin-top:14px;flex-direction:column"><b>Suggestions</b>${list.map((q) => `<span>${esc(q)}</span>`).join("")}<button class="btn sm" id="useai">Use These</button></div>` : "";
      if ($("#useai")) $("#useai").addEventListener("click", () => { state.ob.questions = list; renderOnboarding(v); toast("Press Save to keep them"); });
    } catch { toast("Couldn’t get suggestions. Try again."); } finally { b.disabled = false; b.textContent = "Suggest With AI"; }
  });
  if (state.db) state.db.collection("onboarding_responses").where("guild", "==", gid()).limit(200).get().then((snap) => {
    if (snap.empty || !$("#obrows")) return;
    $("#obrows").innerHTML = snap.docs.map((d) => d.data()).map((r) => `<tr><td><b>${esc(r.discord || "")}</b></td><td>${esc(fmtDate(r.joined || ""))}</td><td>${r.tiktok ? `<span class="pill good">@${esc(r.tiktok)}</span>` : '<span class="pill line">Not yet</span>'}</td>${qs.map((q) => `<td>${esc((r.answers || {})[q] || "—")}</td>`).join("")}<td><span class="pill">${esc(r.status || "")}</span></td></tr>`).join("");
  }).catch(() => {});
}

/* ---------- bot & channels ---------- */
function renderSetup(v) {
  const g = state.guild; const used = (state.allow && state.allow.channels) || [];
  v.innerHTML = heroHTML("Bot & channels", g ? g.guildName : "Your server", "Your bot, the server it’s in, and exactly which channels it may use.") + `
    <div class="grid">
      <section class="card"><div class="head"><h2>Server</h2><button class="btn sm" id="resync">Re-sync From Discord</button></div>
        ${g ? `<div class="rows"><div><span class="grow">Server</span><b>${esc(g.guildName)}</b></div><div><span class="grow">Bot</span><b>${esc(g.botName)}</b></div><div><span class="grow">Text channels</span><b>${g.channels.length}</b></div><div><span class="grow">Roles</span><b>${g.roles.length}</b></div><div><span class="grow">Last checked</span><b>${esc(fmtTime(g.syncedAt))}</b></div></div>` : '<div class="empty">No server connected. Run the <a href="#welcome">setup guide</a>.</div>'}
      </section>
      <section class="card"><div class="head"><h2>Allowlist</h2><span class="pill ${state.allow && state.allow.syncedAt ? "good" : ""}">${state.allow && state.allow.syncedAt ? "Applied " + esc(fmtTime(state.allow.syncedAt)) : "Waiting for Claude"}</span></div>
        <p class="muted" style="margin-top:0">Built from the channels your automations and mod channel use. The bot may read and post only here.</p>
        ${used.length ? `<div class="rows">${used.map((c) => `<div><span class="grow"><b>#${esc(c.name)}</b></span><code>${esc(c.id)}</code></div>`).join("")}</div>` : '<div class="empty">No channels chosen yet.</div>'}
        ${used.length && !(state.allow && state.allow.syncedAt) ? '<button class="btn sm" id="applyAllow" style="margin-top:10px">Apply Allowlist Now</button>' : ""}
      </section>
      <section class="card span"><div class="head"><h2>Bot voice</h2></div><form class="form" id="bf">
        <label class="field"><span>Mod channel</span>${chanSelect("b-mod", state.cfg.modChannel)}<small>Drafts and flags go here.</small></label>
        <label class="field"><span>Approver role</span><select id="b-role"><option value="">Anyone in the mod channel</option>${((g && g.roles) || []).map((r) => `<option ${r === state.cfg.approverRole ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></label>
        <label class="field span"><span>Tone of voice</span><textarea id="b-tone">${esc(state.cfg.tone)}</textarea><small>Claude follows this in every post and reply.</small></label>
        <div class="span"><button class="btn primary">Save</button></div></form></section>
      <section class="card span"><div class="head"><h2>Channels in ${esc(g ? g.guildName : "the server")}</h2><span class="muted">${chans().length} text channels with their IDs</span></div>
        ${chans().length ? `<div class="tablebox"><table><thead><tr><th>Channel</th><th>Category</th><th>Bot access</th><th>Used by</th><th>Channel ID</th></tr></thead><tbody>${chans().map((c) => { const by = AUTOS.filter((a) => state.autos[a.key].channel === c.id).map((a) => a.name); if (state.cfg.modChannel === c.id) by.push("Mod channel"); return `<tr><td><b>#${esc(c.name)}</b></td><td class="muted">${esc(c.category)}</td><td>${c.canPost === false ? '<span class="pill bad">Can’t see</span>' : c.canPost ? '<span class="pill good">Can post</span>' : '<span class="muted">Unknown</span>'}</td><td>${by.map((x) => `<span class="pill">${esc(x)}</span>`).join(" ") || '<span class="muted">—</span>'}</td><td><code>${esc(c.id)}</code></td></tr>`; }).join("")}</tbody></table></div>` : '<div class="empty">No channels yet.</div>'}
      </section>
    </div>`;
  $("#resync").addEventListener("click", async (e) => { e.currentTarget.disabled = true; if (await ask("sync", {})) toast("Asked Claude to re-check your server"); watchGuilds(); });
  if ($("#applyAllow")) $("#applyAllow").addEventListener("click", async () => { if (await ask("allowlist", {})) toast("Asked Claude to apply the allowlist"); });
  $("#bf").addEventListener("submit", async (e) => { e.preventDefault(); state.cfg = { ...state.cfg, modChannel: $("#b-mod").value, approverRole: $("#b-role").value, tone: $("#b-tone").value }; if (await putDoc("config/" + gid(), { guild: gid(), ...state.cfg })) { await syncAllow(); toast("Saved"); renderSetup(v); } });
}

/* ---------- boot ---------- */
setRange("7"); route();
(async () => {
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [mcp, db, sample] = await Promise.all([use("mcp"), use("db"), use("sample")]);
  state.mcp = mcp; state.db = db; state.sample = sample;
  if (mcp) {
    try {
      const t = textOf(await mcp.callTool(SERVER, "list_shops", {}, { cache: { staleTime: 300000, gcTime: 86400000 } }));
      state.shops = t.split("\n").map((l) => l.match(/^- (.+) \(ID: ([a-f0-9]+),(?: active: \w+,)? plan: ([^,]+), region: (\w+)\)/)).filter(Boolean).map((m) => ({ name: m[1], id: m[2], plan: m[3], region: m[4] }));
      setStatus("#stCruva", true, "Cruva connected");
    } catch (e) { setStatus("#stCruva", false, "Cruva: not connected"); }
    try { const l = await mcp.listTools(BRIDGE); state.bridge = !!(l.servers && l.servers.length); } catch { state.bridge = false; }
  } else setStatus("#stCruva", false, "Cruva: not available here");
  setStatus("#stLink", state.bridge, state.bridge ? "Live link to Claude: on" : "Live link to Claude: off");
  await loadWorkspace(); watchGuilds();
  let saved = null; try { saved = localStorage.getItem("tvc.shop"); } catch {}
  state.shop = state.shops.find((s) => s.id === saved) || state.shops.find((s) => s.id === (state.ws && state.ws.shopId)) || state.shops[0] || null;
  $("#brand").innerHTML = state.shops.map((s) => `<option value="${esc(s.id)}" ${state.shop && s.id === state.shop.id ? "selected" : ""}>${esc(s.name)} · ${esc(s.region.toUpperCase())}</option>`).join("") || "<option>No brands</option>";
  botStatus();
  if (state.ws && !state.ws.done) state.wizStep = state.guild ? (state.ws.channelsDone ? 3 : 2) : 1;
  state.booted = true; route();
})();
})();
</script>
