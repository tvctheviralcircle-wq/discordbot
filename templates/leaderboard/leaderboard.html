<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1c2548;--green:#089143;--red:#cf2736;--gold:#e9b949;--silver:#c9d0de;--bronze:#d08a52}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;font-family:Lexend,system-ui,sans-serif}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;padding:0 64px;
 background:radial-gradient(circle at 50% 30%,#2e3a6e 0%,#1c2548 50%,#0f1430 100%)}
.flag{display:flex;height:12px;margin:0 -64px}.flag i{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:40px}
.top img{height:56px;filter:brightness(0) invert(1)}
.pill{font-size:20px;font-weight:700;padding:10px 22px;border-radius:999px;border:2px solid rgba(255,255,255,.6)}
.title{margin-top:46px;text-align:center}
.title small{display:block;font-size:24px;font-weight:700;letter-spacing:.3em;color:var(--gold)}
.title h1{font-size:96px;font-weight:800;line-height:1;margin-top:10px;letter-spacing:-.01em}
.podium{margin-top:60px;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:22px}
.p{display:flex;flex-direction:column;align-items:center;text-align:center}
.av{border-radius:50%;padding:8px;position:relative}
.av .in{width:100%;height:100%;border-radius:50%;background:#3a4470;background-size:cover;background-position:center;overflow:hidden}
.rk{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--navy);border:4px solid #1c2548}
.p .h{margin-top:30px;font-size:26px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .g{margin-top:6px;font-size:40px;font-weight:800}
.p .g small{display:block;font-size:15px;font-weight:600;letter-spacing:.12em;opacity:.65;margin-top:2px}
.base{margin-top:22px;width:100%;border-radius:18px 18px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:22px;font-weight:800;letter-spacing:.1em}
.rows{margin-top:0;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:22px;padding:6px 28px}
.r{display:grid;grid-template-columns:60px 76px 1fr auto;align-items:center;gap:20px;padding:18px 0}
.r+.r{border-top:2px solid rgba(255,255,255,.08)}
.r .n{font-size:34px;font-weight:800;opacity:.7}
.r .a{width:76px;height:76px;border-radius:50%;background:#3a4470;background-size:cover;background-position:center;overflow:hidden}
.r .h{font-size:28px;font-weight:700}
.r .g{font-size:34px;font-weight:800;color:#7fd6a3}
.foot{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:20px;font-weight:600;opacity:.6}
</style></head>
<body><div class="card">
<div class="flag"><i style="background:var(--green)"></i><i style="background:#fff"></i><i style="background:var(--red)"></i></div>
<div class="top"><img src="logo.png"><div class="pill" id="dates"></div></div>
<div class="title"><small>LEADERBOARD</small><h1>WEEKLY TOP<br>CREATORS</h1></div>
<div class="podium" id="podium"></div>
<div class="rows" id="rows"></div>
<div class="foot">ranked by GMV generated last week</div>
</div>
<script>
// data: ?d=<json> where json = {dates:"Oct 18 – 24, 2026", top:[{h:"handle",g:515.19,a:"photo.jpg"|null}, ...5]}
const D=JSON.parse(new URLSearchParams(location.search).get('d'));
document.getElementById('dates').textContent=D.dates;
const SIL='<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="38" r="18" fill="#5a6596"/><path d="M14 92c4-20 18-30 36-30s32 10 36 30z" fill="#5a6596"/></svg>';
const money=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pod=document.getElementById('podium');
const MED={1:['var(--gold)',230,180],2:['var(--silver)',180,130],3:['var(--bronze)',180,100]};
[2,1,3].forEach(rank=>{const c=D.top[rank-1];const [col,size,baseH]=MED[rank];
 const p=document.createElement('div');p.className='p';
 p.innerHTML=`<div class="av" style="width:${size}px;height:${size}px;background:${col}"><div class="in" ${c.a?`style="background-image:url(${c.a})"`:''}>${c.a?'':SIL}</div><div class="rk" style="background:${col}">${rank}</div></div>
 <div class="h">@${c.h}</div><div class="g" style="color:${rank===1?'var(--gold)':'#fff'}">${money(c.g)}<small>GMV</small></div>
 <div class="base" style="height:${baseH}px;background:linear-gradient(180deg,${col} 0%,rgba(255,255,255,.04) 100%);color:#1c2548">#${rank}</div>`;
 pod.append(p)});
const rows=document.getElementById('rows');
D.top.slice(3,5).forEach((c,i)=>{const r=document.createElement('div');r.className='r';
 r.innerHTML=`<div class="n">#${i+4}</div><div class="a" ${c.a?`style="background-image:url(${c.a})"`:''}>${c.a?'':SIL}</div><div class="h">@${c.h}</div><div class="g">${money(c.g)}</div>`;rows.append(r)});
</script>
</body></html>
